name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  container:
    name: Build image and smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/make-certs.sh certs
      - run: docker build -t can-telemetry-api:ci .
      - name: Check it's not running as root
        run: test "$(docker run --rm can-telemetry-api:ci id -u)" = 10001
      - name: Start the container
        run: |
          docker run -d --name api -p 8443:8443 --user "$(id -u):$(id -g)" \
            -v "$PWD/certs:/certs:ro" \
            -e TLS_CERT_FILE=/certs/server.crt -e TLS_KEY_FILE=/certs/server.key \
            can-telemetry-api:ci
      - run: bash scripts/smoke-test.sh https://localhost:8443 certs/ca.crt
      - name: Container logs
        if: failure()
        run: docker logs api

  kubernetes:
    name: Deploy to kind and smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: helm/kind-action@v1
        with:
          cluster_name: ci
      - run: bash scripts/make-certs.sh certs
      - run: docker build -t can-telemetry-api:dev .
      - run: kind load docker-image can-telemetry-api:dev --name ci
      - name: Deploy
        run: |
          kubectl create secret tls can-telemetry-tls --cert=certs/server.crt --key=certs/server.key
          kubectl apply -f k8s/
          kubectl rollout status deployment/can-telemetry --timeout=120s
      - name: Smoke test through the Service
        run: |
          kubectl port-forward service/can-telemetry 8443:443 > port-forward.log 2>&1 &
          bash scripts/smoke-test.sh https://localhost:8443 certs/ca.crt
      - name: Pod status and logs
        if: failure()
        run: |
          kubectl describe pods -l app.kubernetes.io/name=can-telemetry
          kubectl logs -l app.kubernetes.io/name=can-telemetry --tail=100
          cat port-forward.log || true

  publish:
    name: Publish image to GitHub Container Registry
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [container, kubernetes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker build \
            --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "$image:${GITHUB_SHA::7}" -t "$image:latest" .
          docker push --all-tags "$image"
