name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  container:
    name: Build image and smoke test
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: bash scripts/make-certs.sh certs
      - run: docker build -t can-telemetry-api:ci .
      - name: The image runs as uid 10001
        run: test "$(docker run --rm can-telemetry-api:ci id -u)" = 10001
      - name: Start the container
        run: |
          docker run -d --name api -p 8443:8443 --user "$(id -u):$(id -g)" \
            -v "$PWD/certs:/certs:ro" \
            -e TLS_CERT_FILE=/certs/server.crt -e TLS_KEY_FILE=/certs/server.key \
            can-telemetry-api:ci
      - run: bash scripts/smoke-test.sh https://localhost:8443 certs/ca.crt
      - name: Container logs
        if: failure()
        run: docker logs api